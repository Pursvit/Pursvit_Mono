name: Backend CI

on:
  push:
    path:
      - "backend/**"

  pull_request:
    branches:
      - "**"
    paths:
      - "backend/**"

jobs:
  build:
    runs-ons: ubuntu-latest

    strategy:
      matrix:
        node-version: ["22.x"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with: 
          node-version: ${{ matrix.node-version }}
          cache: "npm"
          cache-dependency-paths: package-lock.json

      - name: Install Dependencies
        run: |
          npm ci

      - name: Format Check
        run: |
          npm prettier --check backend

      - name: Build
        run: |
          npm run build -w backend